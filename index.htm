<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Weather</title>
</head>
<body>
    <div class ="card">
        <div class="search">
            <input type="text" placeholder="enter city name" spellcheck="false">
      <button>
        <img src="vector-search-icon.jpg" alt="search icon" >
      </button>
        </div>
        <div class="error">
            <p>Invalid City</p>
        </div>
        <div class="Weather">
            <img src="image_processing20weather icon.png" alt="" class="weather_icon" >
            <h1 class="temp">22°c</h1>
            <h2 class="city">New York</h2>
            <div class="details">
                <div class="col">
                    <img src="humidity2.webp" alt="" >
                    <p class="humidity">50%</p>
                    
                    <p>Humidity</p>
                </div>
                <div class="col">
                    <img src="wind3.webp" alt="" >
                    <p class="wind">15 km/h</p>
                    <p>wind speed</p>
                </div>
            </div>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
